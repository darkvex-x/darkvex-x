name: Recent Activity

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and render recent public activity
        uses: actions/github-script@v7
        with:
          script: |
            const { data: events } = await github.rest.activity.listPublicEventsForUser({
              username: 'darkvex-x', per_page: 5
            });
            const labels = {
              PushEvent: 'Pushed updates to', CreateEvent: 'Created',
              WatchEvent: 'Starred', ForkEvent: 'Forked', IssuesEvent: 'Opened an issue in',
              PullRequestEvent: 'Updated a pull request in'
            };
            const lines = events.map(event => {
              const repo = event.repo?.name || 'a repository';
              const action = labels[event.type] || 'Worked in';
              return `- \`${action}\` [${repo}](https://github.com/${repo})`;
            });
            const activity = lines.length ? `### Recent activity\n\n${lines.join('\n')}` : '';
            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!-- RECENT_ACTIVITY:START -->[\s\S]*?<!-- RECENT_ACTIVITY:END -->/,
              `<!-- RECENT_ACTIVITY:START -->\n${activity}\n<!-- RECENT_ACTIVITY:END -->`
            );
            fs.writeFileSync('README.md', updated);
      - name: Commit refreshed activity
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh recent activity"
