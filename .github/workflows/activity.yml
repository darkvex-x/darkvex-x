name: Recent Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */12 * * *"

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Activity SVG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const { data: events } =
              await github.rest.activity.listPublicEventsForUser({
                username: "darkvex-x",
                per_page: 5
              });

            const rows = events.map((e, i) => `
              <text x="50" y="${80 + i * 30}"
                    fill="#ffffff"
                    font-size="16"
                    font-family="Arial">
                • ${e.type} — ${e.repo.name}
              </text>
            `).join("");

            const svg = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="900"
                 height="250">

              <rect width="100%" height="100%" fill="#0d1117"/>

              <text
                  x="50"
                  y="35"
                  fill="#58a6ff"
                  font-size="22"
                  font-family="Arial"
                  font-weight="bold">

                  Recent GitHub Activity

              </text>

              ${rows}

            </svg>
            `;

            fs.writeFileSync("activity.svg", svg);

      - name: Commit SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update activity"
          file_pattern: activity.svg
