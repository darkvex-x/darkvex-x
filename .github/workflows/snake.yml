name: Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution animation
        uses: Platane/snk@v3
        with:
          github_user_name: darkvex-x
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#00E5FF

      # Publishes snake.svg to the output branch used by the README image URL.
      - name: Publish contribution animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
